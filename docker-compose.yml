version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cognitive_db
    environment:
      POSTGRES_USER: cognitive_user
      POSTGRES_PASSWORD: cognitive_pass
      POSTGRES_DB: cognitive_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: cognitive_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://cognitive_user:cognitive_pass@db:5432/cognitive_db
    volumes:
      - ./backend:/app   # live reload for development

  frontend:
    build: ./frontend
    container_name: cognitive_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules   # avoid overwriting node_modules

volumes:
  postgres_data:
